[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "block-xsim"
version = "1.0.0"
description = "Block-xSIM++: find the reference translation of a multi-sentence block among perturbed copies"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Adle Ben Salem"}]
requires-python = ">=3.10"
# The core install is enough to read the results; the experiments need the extra.
dependencies = ["pydantic>=2.6,<3", "numpy>=1.20"]

[project.optional-dependencies]
experiments = [
    "unbabel-comet==2.2.7",
    "torch",
    "transformers",
    "tqdm",
    "spacy>=3.7",
    "datasets>=2.14",
    "huggingface-hub>=0.19.3",
    "sacrebleu>=2.0",
]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["block_xsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
